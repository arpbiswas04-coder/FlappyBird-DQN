services:
  - type: web
    name: flappy-bird-dqn
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn webapp.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: SDL_VIDEODRIVER
        value: "dummy"
      - key: MODEL_URL
        value: "https://github.com/arpbiswas04-coder/FlappyBird-DQN/releases/download/v1.0.0/flappybird-model.zip"
